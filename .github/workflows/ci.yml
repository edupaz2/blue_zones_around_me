name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The e2e webServer builds its own base-"/" bundle into dist.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      # Final build for GitHub Pages (overwrites the e2e build in dist).
      - run: npm run build
        env:
          VITE_BASE: /blue_zones_around_me/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read # lets the guard below read the tip of main
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Re-running an older workflow run (or a slow run finishing after a newer one) would
      # redeploy that run's older build over the live site. Only the tip of main may deploy.
      - id: guard
        name: Only deploy the latest commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$latest" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::This run is for ${SHA} but main is now at ${latest}. Not deploying an older build."
          fi
      - id: deployment
        if: steps.guard.outputs.current == 'true'
        uses: actions/deploy-pages@v4
